<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barter System - Trade Items</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🔄 Barter System</h1>
            <p>Trade items without money - Exchange what you have for what you need!</p>
        </div>
    </header>

    <main class="container">
        <!-- Add Item Form -->
        <section class="add-item-section">
            <h2>Add Item to Trade</h2>
            <form id="addItemForm" class="item-form">
                <div class="form-group">
                    <input type="text" id="title" placeholder="Item Title" required>
                    <input type="text" id="owner" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <select id="category">
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Music">Music</option>
                        <option value="Sports">Sports</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="wantedItems" placeholder="What you want in exchange">
                </div>
                <textarea id="description" placeholder="Describe your item..." required></textarea>
                <button type="submit">Add Item</button>
            </form>
        </section>

        <!-- Items Display -->
        <section class="items-section">
            <h2>Available Items for Trade</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search items...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Books">Books</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Music">Music</option>
                    <option value="Sports">Sports</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div id="itemsContainer" class="items-grid">
                <!-- Items will be loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Barter System. Trade responsibly!</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
